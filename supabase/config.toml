# Konfigurasi Supabase lokal — ImpactAqiqah
# Dokumen acuan: docs/22_DEPLOYMENT_PLAN.md
project_id = "impactaqiqah"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# URL situs untuk redirect (sesuaikan per environment)
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
# Bucket dibuat via migration/console: documentation, payment-proofs, reports, public-assets
file_size_limit = "50MiB"
